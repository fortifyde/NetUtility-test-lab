#cloud-config
hostname: debian-target
manage_etc_hosts: true

bootcmd:
  - modprobe 8021q || true
  - echo '8021q' > /etc/modules-load.d/vlan.conf
  - |
    TRUNK=$(ip -br link show | grep 52:54:00:0b:01:01 | awk '{print $1}')
    if [ -n "$TRUNK" ]; then
      ip link set $TRUNK up
      ip link add link $TRUNK name $TRUNK.10 type vlan id 10
      ip addr add ${debian_ip}/24 dev $TRUNK.10
      ip link set $TRUNK.10 up
      ip link add link $TRUNK name $TRUNK.20 type vlan id 20
      ip addr add ${vlan20_ip}/24 dev $TRUNK.20
      ip link set $TRUNK.20 up
    fi

users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - openssh-server
  - snmpd
  - nginx
  - bind9
  - bind9utils
  - dnsutils
  - vlan
  - arping

write_files:
  # --- SNMP configuration ---
  - path: /etc/snmp/snmpd.conf
    owner: root:root
    permissions: "0644"
    content: |
      # NetUtility Lab — SNMP configuration
      rocommunity ${snmp_community_ro} default
      rocommunity ${snmp_community_rw} 10.10.10.0/24
      rwcommunity ${snmp_community_rw} localhost

      syslocation "Test Lab Rack 1"
      syscontact admin@${domain}

      # Enable all MIBs
      view all    included  .1
      view system included  .1.3.6.1.2.1.1
      view system included  .1.3.6.1.2.1.25

      # Full access for local and VLAN 10
      com2sec readonly  default         ${snmp_community_ro}
      com2sec readwrite 10.10.10.0/24   ${snmp_community_rw}

      group roGroup v1         readonly
      group roGroup v2c        readonly
      group roGroup usm        readonly
      group rwGroup v1         readwrite
      group rwGroup v2c        readwrite
      group rwGroup usm        readwrite

      access roGroup "" any noauth exact all none none
      access rwGroup "" any noauth exact all all  none

      # Default: listen on all interfaces, port 161
      agentAddress udp:161

      # Disk and load monitoring
      disk /
      load 12 10 5

  # --- Nginx: default site (port 80) ---
  - path: /etc/nginx/sites-available/default
    owner: root:root
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name debian.${domain};

          root /var/www/html;
          index index.html;

          location / {
              try_files $uri $uri/ =404;
          }

          location /health {
              return 200 'OK';
              add_header Content-Type text/plain;
          }
      }

  # --- Nginx: API-like site (port 8080) ---
  - path: /etc/nginx/sites-available/api
    owner: root:root
    permissions: "0644"
    content: |
      server {
          listen 8080;
          listen [::]:8080;

          server_name api.debian.${domain};

          root /var/www/api;
          index index.json;

          location / {
              try_files $uri $uri/ =404;
              add_header Content-Type application/json;
          }

          location /status {
              return 200 '{"status":"ok","host":"debian-target","service":"api"}';
              add_header Content-Type application/json;
          }

          location /version {
              return 200 '{"name":"test-api","version":"1.0.0"}';
              add_header Content-Type application/json;
          }
      }

  # --- Test HTML page ---
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>Debian Test Page</title></head>
      <body>
      <h1>NetUtility Lab — Debian Target</h1>
      <p>This is the default web page for debian-target.</p>
      <ul>
        <li>Host: debian-target</li>
        <li>VLAN 10: 10.10.10.10</li>
        <li>VLAN 20: 10.10.20.10</li>
      </ul>
      </body>
      </html>

  # --- API test content ---
  - path: /var/www/api/index.json
    owner: root:root
    permissions: "0644"
    content: |
      {"service":"test-api","version":"1.0.0","endpoints":["/status","/version"]}

  # --- Bind9: test.local zone ---
  - path: /etc/bind/zones/db.${domain}
    owner: root:root
    permissions: "0644"
    content: |
      $TTL 300
      @ IN SOA ns1.${domain}. admin.${domain}. (
              2024010101  ; Serial
              3600        ; Refresh
              900         ; Retry
              604800      ; Expire
              86400       ; Minimum TTL
      )
      @       IN NS   ns1.${domain}.
      ns1     IN A    10.10.10.10
      debian  IN A    10.10.10.10
      ubuntu  IN A    10.10.10.20
      dmz     IN A    10.10.30.10
      www     IN CNAME debian.${domain}.
      @       IN MX  10 mail.${domain}.
      mail    IN A    10.10.10.10

  # --- Bind9: named.conf.local with zone declaration ---
  - path: /etc/bind/named.conf.local
    owner: root:root
    permissions: "0644"
    content: |
      zone "${domain}" {
          type master;
          file "/etc/bind/zones/db.${domain}";
          allow-query { any; };
      };

  # --- Enable IP forwarding ---
  - path: /etc/sysctl.d/99-ip-forward.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.ip_forward = 1

  # --- Netplan: persistent VLAN config ---
  - path: /etc/netplan/51-vlans.yaml
    owner: root:root
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          ens4:
            dhcp4: false
        vlans:
          ens4.10:
            id: 10
            link: ens4
            addresses:
              - ${debian_ip}/24
          ens4.20:
            id: 20
            link: ens4
            addresses:
              - ${vlan20_ip}/24

  - path: /usr/local/bin/netlab-traffic.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      # Sends gratuitous ARP on all VLAN interfaces every 30 seconds so
      # NetUtility auto-discovery sees this host without requiring a prior scan.
      while true; do
          for iface in $(ip -o -4 addr show | awk '{print $2}' | grep -v '^lo$' | sort -u); do
              ip_addr=$(ip -4 addr show dev "$iface" 2>/dev/null \
                  | grep -oP '(?<=inet )[0-9.]+' | head -1)
              if [ -n "$ip_addr" ]; then
                  arping -c 1 -A -I "$iface" "$ip_addr" >/dev/null 2>&1 || true
              fi
          done
          sleep 30
      done

  - path: /etc/systemd/system/netlab-traffic.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=NetUtility lab traffic generator
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/netlab-traffic.sh
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  # --- Traffic generation ---
  - systemctl daemon-reload
  - systemctl enable netlab-traffic.service || true
  - systemctl start netlab-traffic.service || true

  # --- SNMP ---
  - sed -i 's/^SNMPDOPTS=.*/SNMPDOPTS="-Lf /var/log/snmpd.log -u Debian-snmp -g Debian-snmp -I -smux -p /var/run/snmpd.sock"/' /etc/default/snmpd || true
  - systemctl restart snmpd || true
  - systemctl enable snmpd || true

  # --- Nginx ---
  - ln -sf /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api || true
  - nginx -t || true
  - systemctl restart nginx || true
  - systemctl enable nginx || true

  # --- Bind9 ---
  - mkdir -p /etc/bind/zones
  - chown root:bind /etc/bind/zones/db.${domain} /etc/bind/named.conf.local
  - named-checkzone ${domain} /etc/bind/zones/db.${domain} || true
  - systemctl restart bind9 || true
  - systemctl enable bind9 || true

  # --- IP forwarding ---
  - sysctl --system || true

  # --- Ensure VLAN interfaces (fallback if bootcmd failed) ---
  - |
    TRUNK=$(ip -br link show | grep 52:54:00:0b:01:01 | awk '{print $1}')
    if [ -n "$TRUNK" ]; then
      ip link set $TRUNK up
      ip link add link $TRUNK name $TRUNK.10 type vlan id 10 2>/dev/null || true
      ip addr add ${debian_ip}/24 dev $TRUNK.10 2>/dev/null || true
      ip link set $TRUNK.10 up
      ip link add link $TRUNK name $TRUNK.20 type vlan id 20 2>/dev/null || true
      ip addr add ${vlan20_ip}/24 dev $TRUNK.20 2>/dev/null || true
      ip link set $TRUNK.20 up
    fi
  - netplan apply || true