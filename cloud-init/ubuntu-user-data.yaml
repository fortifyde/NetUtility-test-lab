#cloud-config
hostname: ubuntu-target
manage_etc_hosts: true

bootcmd:
  - modprobe 8021q || true
  - echo '8021q' > /etc/modules-load.d/vlan.conf
  - |
    TRUNK=$(ip -br link show | grep 52:54:00:0c:01:01 | awk '{print $1}')
    if [ -n "$TRUNK" ]; then
      ip link set $TRUNK up
      ip link add link $TRUNK name $TRUNK.10 type vlan id 10
      ip addr add ${ubuntu_ip}/24 dev $TRUNK.10
      ip link set $TRUNK.10 up
      ip link add link $TRUNK name $TRUNK.20 type vlan id 20
      ip addr add ${vlan20_ip}/24 dev $TRUNK.20
      ip link set $TRUNK.20 up
    fi

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
    lock_passwd: false

packages:
  - openssh-server
  - snmpd
  - apache2
  - vsftpd
  - ssl-cert
  - vlan

write_files:
  # ── SNMP configuration ──────────────────────────────────────
  - path: /etc/snmp/snmpd.conf
    owner: root:root
    permissions: "0644"
    content: |
      # NetUtility lab SNMP configuration
      rocommunity ${snmp_community_ro} default
      rocommunity ${snmp_community_rw} 10.10.10.0/24
      rwcommunity ${snmp_community_rw} default
      syslocation "Test Lab Rack 2"
      syscontact admin@${domain}
      # Expose process and interface information
      view systemview included .1.3.6.1.2.1.1
      view systemview included .1.3.6.1.2.1.25.1.1
      view systemview included .1.3.6.1.2.1.2
      view systemview included .1.3.6.1.4.1.2021
      roview systemview
      rwview systemview
      master agentx

  # ── Apache default site ─────────────────────────────────────
  - path: /etc/apache2/sites-available/000-default.conf
    owner: root:root
    permissions: "0644"
    content: |
      <VirtualHost *:80>
        ServerName ubuntu.${domain}
        DocumentRoot /var/www/html
        ErrorLog $${APACHE_LOG_DIR}/error.log
        CustomLog $${APACHE_LOG_DIR}/access.log combined
      </VirtualHost>

  # ── Apache SSL site ─────────────────────────────────────────
  - path: /etc/apache2/sites-available/default-ssl.conf
    owner: root:root
    permissions: "0644"
    content: |
      <IfModule mod_ssl.c>
        <VirtualHost _default_:443>
          ServerName ubuntu.${domain}
          DocumentRoot /var/www/html

          SSLEngine on
          SSLCertificateFile /etc/apache2/ssl/server-md5.crt
          SSLCertificateKeyFile /etc/apache2/ssl/server-md5.key

          ErrorLog $${APACHE_LOG_DIR}/ssl-error.log
          CustomLog $${APACHE_LOG_DIR}/ssl-access.log combined
        </VirtualHost>
      </IfModule>

  # ── vsftpd configuration ────────────────────────────────────
  - path: /etc/vsftpd.conf
    owner: root:root
    permissions: "0644"
    content: |
      listen=YES
      listen_ipv6=NO
      anonymous_enable=YES
      anon_root=/var/ftp
      local_enable=YES
      write_enable=YES
      local_umask=022
      anon_upload_enable=YES
      anon_mkdir_write_enable=YES
      dirmessage_enable=YES
      use_localtime=YES
      xferlog_enable=YES
      connect_from_port_20=YES
      chroot_local_user=YES
      secure_chroot_dir=/var/run/vsftpd/empty
      pam_service_name=vsftpd
      utf8_filesystem=YES

  # ── Web content ─────────────────────────────────────────────
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>Ubuntu Test Server</title></head>
      <body>
      <h1>Welcome to ubuntu.${domain}</h1>
      <p>Apache2 default page for NetUtility security testing.</p>
      <ul>
        <li><a href="/admin">Admin Panel</a></li>
        <li><a href="/api">API Endpoint</a></li>
      </ul>
      </body>
      </html>

  - path: /var/www/html/admin/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>Admin Panel</title></head>
      <body>
      <h1>Administration Panel</h1>
      <p>Internal admin interface — authorized personnel only.</p>
      <form method="POST" action="/admin/login">
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br>
        <button type="submit">Login</button>
      </form>
      <!-- admin:admin123 — test credentials for scanning -->
      </body>
      </html>

  - path: /var/www/html/api/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>API</title></head>
      <body>
      <h1>REST API</h1>
      <p>Available endpoints:</p>
      <pre>
      GET  /api/v1/status   — service health
      GET  /api/v1/users    — user listing
      POST /api/v1/auth     — authentication
      </pre>
      </body>
      </html>

  # ── FTP test files ──────────────────────────────────────────
  - path: /var/ftp/welcome.txt
    owner: root:root
    permissions: "0644"
    content: |
      Welcome to the anonymous FTP server on ubuntu.${domain}
      This is a test file for security scanning.

  - path: /var/ftp/pub/readme.txt
    owner: root:root
    permissions: "0644"
    content: |
      Public FTP share — test data for NetUtility lab.


  # ── Persistent VLAN configuration (netplan) ───────────────
  - path: /etc/netplan/51-vlans.yaml
    owner: root:root
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          ens4:
            dhcp4: false
        vlans:
          ens4.10:
            id: 10
            link: ens4
            addresses:
              - ${ubuntu_ip}/24
          ens4.20:
            id: 20
            link: ens4
            addresses:
              - ${vlan20_ip}/24
runcmd:
  # ── Generate intentionally weak SSL certificates ────────────
  - mkdir -p /etc/apache2/ssl

  # Weak MD5-signed certificate (valid)
  - |
    openssl req -x509 -newkey rsa:2048 -keyout /etc/apache2/ssl/server-md5.key \
      -out /etc/apache2/ssl/server-md5.crt -days 365 -nodes \
      -subj "/C=US/ST=Test/L=Test/O=NetUtility/CN=ubuntu.${domain}" \
      -md md5

  # Small 512-bit RSA key certificate (weak key size)
  - |
    openssl req -x509 -newkey rsa:512 -keyout /etc/apache2/ssl/server-weak.key \
      -out /etc/apache2/ssl/server-weak.crt -days 365 -nodes \
      -subj "/C=US/ST=Test/L=Test/O=NetUtility/CN=ubuntu.${domain}" \
      -md sha256

  # Expired certificate
  - |
    openssl req -x509 -newkey rsa:2048 -keyout /etc/apache2/ssl/server-expired.key \
      -out /etc/apache2/ssl/server-expired.crt -days 0 -nodes \
      -subj "/C=US/ST=Test/L=Test/O=NetUtility/CN=ubuntu.${domain}" \
      -md sha256 || true

  # ── Configure and enable Apache ─────────────────────────────
  - a2enmod ssl
  - a2ensite default-ssl.conf
  - systemctl restart apache2

  # ── Configure SNMP agent ────────────────────────────────────
  - systemctl restart snmpd
  - systemctl enable snmpd

  # ── Setup FTP directories and start vsftpd ──────────────────
  - mkdir -p /var/ftp/pub/upload
  - chown root:root /var/ftp
  - chmod 755 /var/ftp
  - chown ftp:ftp /var/ftp/pub/upload
  - chmod 755 /var/ftp/pub/upload
  - systemctl restart vsftpd
  - systemctl enable vsftpd

  # --- Ensure VLAN interfaces (fallback if bootcmd failed) ---
  - |
    TRUNK=$(ip -br link show | grep 52:54:00:0c:01:01 | awk '{print $1}')
    if [ -n "$TRUNK" ]; then
      ip link set $TRUNK up
      ip link add link $TRUNK name $TRUNK.10 type vlan id 10 2>/dev/null || true
      ip addr add ${ubuntu_ip}/24 dev $TRUNK.10 2>/dev/null || true
      ip link set $TRUNK.10 up
      ip link add link $TRUNK name $TRUNK.20 type vlan id 20 2>/dev/null || true
      ip addr add ${vlan20_ip}/24 dev $TRUNK.20 2>/dev/null || true
      ip link set $TRUNK.20 up
    fi
  - netplan apply